name: Unity Checks

# Runs Tests/*Checks.cs in a Unity editor on GitHub (see Docs/Cloud-Tests.md).
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite from Tests/CI/suites (smoke, play, performance)"
        default: smoke
      checks:
        description: "Optional instead of suite: comma separated check names, e.g. CaveGenerationChecks,play:GpsRuntimeChecks"
        default: ""
      editorui:
        description: "Unity editor UI on the virtual display: auto (for play checks), 1, 0"
        default: auto
      nographics:
        description: "Run Unity without graphics device (faster, but no rendering)"
        type: boolean
        default: false
      force:
        description: "Run despite throttling (red); only with the user's approval"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    # labeled: the label "cloud-check" starts the one PR run while throttling is yellow.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: unity-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # Hard limit (AGENTS.md, Docs/Cloud-Tests.md): Unity gets until 16 min after the job start (CI_DEADLINE),
    # leaving time for the report; the job itself stops at 20 min.
    timeout-minutes: 20
    env:
      SUITE: ${{ inputs.suite || 'smoke' }}
      CHECKS: ${{ inputs.checks || '' }}
    steps:
      - name: Start clock
        run: echo "CI_DEADLINE=$(( $(date +%s) + 16 * 60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          lfs: false

      # Actions-minute budget (Docs/Cloud-Tests.md → Drosselung): sets CI_RUN=0 to skip the run.
      - name: Budget
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BILLING_TOKEN: ${{ secrets.ACTIONS_BILLING_TOKEN }}
          INCLUDED_MINUTES: ${{ vars.ACTIONS_INCLUDED_MINUTES }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: python3 Tests/CI/budget.py

      - name: Skipped live status
        if: always() && env.CI_RUN == '0'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Tests/CI/progress.py skipped

      - name: Check licence secrets
        if: env.CI_RUN == '1'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "::error::Unity licence secrets are missing (UNITY_EMAIL + UNITY_PASSWORD). See Docs/Cloud-Tests.md."
            exit 1
          fi

      - name: Free disk space
        if: env.CI_RUN == '1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Start live status
        if: env.CI_RUN == '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 Tests/CI/progress.py start
          nohup python3 Tests/CI/progress.py watch > "$RUNNER_TEMP/progress.log" 2>&1 &

      - name: List LFS objects
        if: env.CI_RUN == '1'
        run: git lfs ls-files --long --include="Assets/**" | cut -d' ' -f1 | sort > .lfs-assets-id

      - name: Restore LFS cache
        if: env.CI_RUN == '1'
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Pull LFS files (Assets only)
        if: env.CI_RUN == '1'
        run: git lfs pull --include="Assets/**"

      - name: Restore Library cache
        if: env.CI_RUN == '1'
        id: library
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}-${{ github.sha }}
          restore-keys: |
            Library-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}-

      - name: Prepare checks
        if: env.CI_RUN == '1'
        run: python3 Tests/CI/prepare.py --suite "${CI_SUITE:-$SUITE}" --checks "$CHECKS"

      - name: Run Unity
        if: env.CI_RUN == '1'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          CI_NOGRAPHICS: ${{ inputs.nographics && '1' || '0' }}
          CI_EDITOR_UI: ${{ inputs.editorui || 'auto' }}
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt | tr -d '\r')
          image="unityci/editor:ubuntu-${version}-base-3"
          echo "Image: $image"
          docker run --rm --workdir /project -v "$GITHUB_WORKSPACE:/project" \
            -e UNITY_LICENSE -e UNITY_SERIAL -e UNITY_EMAIL -e UNITY_PASSWORD -e CI_NOGRAPHICS -e CI_EDITOR_UI -e CI_DEADLINE \
            "$image" bash Tests/CI/run-in-container.sh

      - name: Report
        if: always() && env.CI_RUN == '1'
        run: |
          sudo chown -R "$(id -u):$(id -g)" . || true
          if grep -q '"mode": "player"' Artifacts/plan.json 2>/dev/null && [ ! -f Artifacts/ci-results.json ]; then
            python3 Tests/CI/player_report.py $(cat Artifacts/player-meta.txt 2>/dev/null || echo "0 ?") || true
          fi
          if [ -f Artifacts/abort-reason.txt ]; then
            { echo "### ⛔ Abgebrochen"; echo; cat Artifacts/abort-reason.txt; echo; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Lauf abgebrochen::$(cat Artifacts/abort-reason.txt)"
          fi
          if [ -f Artifacts/ci-results.md ]; then cat Artifacts/ci-results.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f Artifacts/editor.log ]; then
            errors=$(grep -E "error CS[0-9]+" Artifacts/editor.log | sort -u | head -50)
            if [ -n "$errors" ]; then
              { echo "### Compilerfehler"; echo '```'; echo "$errors"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
            tail -n 200 Artifacts/editor.log
          fi

      - name: Final live status
        if: always() && env.CI_RUN == '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 Tests/CI/progress.py final --conclusion "${{ job.status }}"

      - name: Upload artifacts
        if: always() && env.CI_RUN == '1'
        uses: actions/upload-artifact@v4
        with:
          name: unity-checks-${{ github.run_number }}
          path: |
            Artifacts
            !Artifacts/player
          retention-days: 14

      - name: Save Library cache
        if: always() && env.CI_RUN == '1' && steps.library.outputs.cache-hit != 'true' && hashFiles('Library/ArtifactDB') != ''
        uses: actions/cache/save@v4
        with:
          path: Library
          key: ${{ steps.library.outputs.cache-primary-key }}
